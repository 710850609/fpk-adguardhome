name: Build and publish fpk

on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # - name: Install Python requirements (if any)
      #   run: |
      #     if [ -f script/requirements.txt ]; then
      #       python -m pip install --upgrade pip
      #       pip install -r script/requirements.txt || true
      #     fi

      - name: Run build package
        run: |
          echo "下载fnpack"
          wget -O fnpack "https://static2.fnnas.com/fnpack/fnpack-1.0.4-linux-amd64"
          echo "开始构建fpk"
          chmod +x ./build.sh || true
          ./build.sh all

      - id: package
        name: Package .fpk
        run: |
          mkdir -p release
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
          else
            TAG="run-${GITHUB_RUN_NUMBER}"
          fi
          FPK_NAME="${PWD##*/}-${TAG}.fpk"
          tar --exclude='.git' --exclude='.github' -czf release/${FPK_NAME} .
          # prerelease only when tag ends with -pre
          if [[ "${TAG}" =~ -pre$ ]]; then
            PRE=true
          else
            PRE=false
          fi
          echo "fpk=release/${FPK_NAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload asset
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.package.outputs.tag }}
          name: Release ${{ steps.package.outputs.tag }}
          files: "*.fpk"
          prerelease: ${{ steps.package.outputs.prerelease }}
