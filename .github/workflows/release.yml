name: release fpk

on:
  push:
    tags:
      - '*'
  workflow_dispatch: 
    inputs:
      release_notes:
        description: '发布说明'
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:  
  # 主 job，负责设置变量
  setup:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.set-tag.outputs.prerelease }}
    steps:
      - name: workflow dispatch params
        run: |
          echo "release_notes: ${{ github.event.inputs.release_notes }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set tag and prerelease info
        id: set-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAG="main"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          
          if [[ "$TAG" == build-* ]] || [[ "${TAG}" == *dev* ]] || [[ "${TAG}" == *pre* ]] || [[ "${TAG}" == *beta* ]]; then
            PRE=true
          else
            PRE=false
          fi
          
          echo "prerelease=$PRE" >> $GITHUB_OUTPUT
          echo "prerelease: ${PRE}"

  # 所有架构都使用 Docker 在 x86 上构建
  build-arch:
    needs: 
      - setup
    runs-on: ubuntu-latest  # 所有架构都在 x86 上运行
    outputs:
      release_version: ${{ steps.get-version.outputs.release_version }}
    strategy:
      matrix:
        include:
          - arch: x86
            docker_image: "amd64/python:3.11"
            platform: "linux/amd64"
          - arch: arm
            # build.sh 脚本可以交叉编译
            docker_image: "amd64/python:3.11"
            platform: "linux/amd64"
            # docker_image: "arm64v8/python:3.11"
            # platform: "linux/arm64/v8"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Docker build script
        run: |
          cat > docker-build.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "开始在容器内构建..."
          # echo "当前架构: $(uname -m)"
          echo "Python 版本: $(python3 --version)"
          echo "当前目录$(pwd)"
          echo "当前资源$(ls -la)"
          
          # 更新系统并安装依赖
          apt-get update
          apt-get install -y \
            rsync \
            jq \
            python3-pip
          
          # 执行构建脚本
          chmod +x ./fnpack.sh 2>/dev/null || true
          chmod +x ./build.sh 2>/dev/null || true
          ./build.sh build_pre="${PRERELEASE}" arch="${ARCH}" build_all="true" download_proxy_url="" 2>/dev/null || true      
          
          # 验证构建结果
          echo "构建后目录内容: $(pwd)"
          echo "$(ls -lh)"
          FPK_FILE=$(ls *.fpk 2>/dev/null | head -1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到.fpk文件"
            ls -la
            exit 1
          fi
          
          echo "构建完成: $FPK_FILE"
          EOF
          
          chmod +x docker-build.sh

      - name: Build in Docker container
        run: |
          echo "使用 Docker 构建 ${{ matrix.arch }} 架构"
          
          # 清理之前的构建文件
          rm -f *.fpk 2>/dev/null || true
          rm -rf release 2>/dev/null || true

          # 运行 Docker 构建
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -e "PRERELEASE=${{ needs.setup.outputs.prerelease }}" \
            -e "ARCH=${{ matrix.arch }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ matrix.docker_image }} \
            /bin/bash -c "
              cd /workspace
              ./docker-build.sh
              
              # 复制构建产物到宿主机可访问的位置
              mkdir -p /output
              FPK_FILE=\$(ls *.fpk 2>/dev/null | head -1)
              if [ -n \"\$FPK_FILE\" ]; then
                cp \"\$FPK_FILE\" /output/
                echo \"已复制产物: \$FPK_FILE\"
              else
                echo '错误：未找到构建产物'
                exit 1
              fi
            "

      - name: Prepare artifact
        run: |
          echo "准备 ${{ matrix.arch }} 架构的产物"
          
          FPK_FILE=$(ls *.fpk 2>/dev/null | head -1)
          if [ -z "$FPK_FILE" ]; then
            echo "错误：未找到.fpk文件"
            ls -la
            exit 1
          fi

          mkdir -p release
          cp "$FPK_FILE" "release/$FPK_FILE"
          echo "准备完成: $FPK_FILE"
          # if [ "${{ needs.setup.outputs.prerelease }}" == "true" ]; then
          #   cp "$FPK_FILE" "release/$FPK_FILE"
          #   echo "准备完成: $FPK_FILE"
          # else
          #   # 正式版去除版本号
          #   NEW_FPK_NAME="AdGuardHome-${{ matrix.arch }}.fpk"
          #   cp "$FPK_FILE" "release/$NEW_FPK_NAME"
          #   echo "准备完成: $NEW_FPK_NAME"
          # fi

      - name: Get release version
        id: get-version
        run: |
          release_version=$(grep -E "^version\s*=" AdGuardHome/manifest | sed -E 's/^version\s*=\s*//')
          echo "release_version=$release_version" >> $GITHUB_OUTPUT
          echo "从manifest中获取release_version: $release_version"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.arch }}
          path: release/
          retention-days: 1

      - name: Cleanup
        run: |
          rm -rf output release *.fpk docker-build.sh 2>/dev/null || true

  create-release:
    needs: 
      - setup
      - build-arch
    runs-on: ubuntu-latest
    steps:
      - name: Create release directory
        run: |
          mkdir -p combined-release
    
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fpk-x86
          path: combined-release

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: fpk-arm
          path: combined-release

      - name: Extract Release Info
        run: |
          if [[ "${{ github.event.inputs.release_notes }}" != '' ]]; then
            echo "- ${{ github.event.inputs.release_notes }}" > release_notes.txt
          else
            awk -v ver="${{ needs.setup.outputs.release_version }}" '
              $0 ~ "^## " ver { found=1; next }
              found && $0 ~ "^## " { exit }
              found { print }
            ' CHANGELOG.md > release_notes.txt
          fi
          echo "release_notes: $(cat release_notes.txt)"
          # 检查是否提取到内容
          if [ ! -s release_notes.txt ]; then
            echo "⚠️ No changelog found for $VERSION, using default message"
            echo "详见 [CHANGELOG.md](./CHANGELOG.md)" > release_notes.txt
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.build-arch.outputs.release_version }}
          tag: ${{ needs.build-arch.outputs.release_version }}
          artifacts: "combined-release/*"
          prerelease: ${{ needs.setup.outputs.prerelease }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: "release_notes.txt"


      - name: Upload release summary
        if: always()
        run: |
          echo "=== 发布总结 ==="
          echo "版本: ${{ needs.build-arch.outputs.release_version }}"
          echo "构建分支: ${{ needs.build-arch.outputs.release_version }}"
          echo "预发布: ${{ needs.setup.outputs.prerelease }}"
          echo "包含的文件:"
          ls -la combined-release/
          echo "================"